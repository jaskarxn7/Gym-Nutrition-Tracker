<!DOCTYPE html>
<html>
<head>
  <title>Daily Nutrition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">

  <div class="card">
    <h2>Daily targets</h2>
    Calories <input id="t-cal" type="number">
    Protein (g) <input id="t-pro" type="number">
    Carbs (g) <input id="t-carb" type="number">
    Fats (g) <input id="t-fat" type="number">
    <button onclick="saveTargets()">Save targets</button>
    <button class="grey" onclick="resetTargets()">Reset to defaults</button>
  </div>

  <div class="card">
    <h2>Ate today</h2>
    Calories <input id="a-cal" type="number">
    Protein (g) <input id="a-pro" type="number">
    Carbs (g) <input id="a-carb" type="number">
    Fats (g) <input id="a-fat" type="number">
    <button onclick="saveAte()">Save intake</button>
  </div>

  <div class="card" id="remaining"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
