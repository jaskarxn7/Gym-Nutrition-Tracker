<!DOCTYPE html>
<html>
<head>
  <title>Weight Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container">

  <div class="card">
    <h2>Add weight</h2>
    Date <input type="date" id="date">
    Weight (kg) <input type="number" step="0.1" id="weight">
    Target weight (kg) <input type="number" step="0.1" id="target">
    <button onclick="saveWeight()">Save</button>
  </div>
  <div class="card" id="log"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
